<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sort It Out! 🌎</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f8f3;
            color: #23412b;
            text-align: center;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: auto;
            padding: 30px 0 50px;
        }

        /* SPROUT */

        .sprout {
            font-size: 75px;
            animation: bounce 2s infinite;
            margin-bottom: 5px;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* TITLE */

        h1 {
            margin: 0;
            font-size: 42px;
            color: #247a3b;
        }

        .subtitle {
            font-size: 20px;
            margin-top: 8px;
            color: #52705a;
        }

        /* SEARCH */

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 16px;
            border: 2px solid #b7d8bd;
            border-radius: 18px;
            font-size: 17px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #247a3b;
        }

        .search-box button {
            padding: 16px 20px;
            border: none;
            border-radius: 18px;
            background: #247a3b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-box button:hover {
            transform: scale(1.03);
        }

        /* CATEGORIES */

        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .category {
            border: none;
            background: white;
            border-radius: 18px;
            padding: 15px 8px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .category:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 14px rgba(0,0,0,0.12);
        }

        .category.active {
            background: #247a3b;
            color: white;
        }

        /* QUICK ITEMS */

        #quickItems {
            display: none;
            background: white;
            border-radius: 22px;
            padding: 20px;
            margin-top: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        #quickItems h3 {
            margin-top: 0;
            color: #247a3b;
        }

        .item-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .item-button {
            border: none;
            background: #edf7ef;
            color: #23412b;
            padding: 11px 15px;
            border-radius: 15px;
            font-size: 15px;
            cursor: pointer;
        }

        .item-button:hover {
            background: #d9eedc;
            transform: scale(1.03);
        }

        /* SPROUT MESSAGE */

        .message-card {
            background: white;
            border-radius: 22px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            font-size: 17px;
        }

        /* POINTS */

        .points-card {
            background: #fff8d9;
            border-radius: 20px;
            padding: 18px;
            margin-top: 15px;
            font-weight: bold;
        }

        /* SCHOOL GOAL */

        .goal-card {
            background: white;
            border-radius: 22px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .progress-background {
            width: 100%;
            height: 18px;
            background: #e2e2e2;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: #247a3b;
            border-radius: 20px;
            transition: width 0.5s;
        }

        /* RESULT */

        #result {
            display: none;
            background: white;
            border-radius: 25px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.10);
        }

        #resultItem {
            font-size: 24px;
            font-weight: bold;
        }

        #resultBin {
            font-size: 30px;
            font-weight: bold;
            margin-top: 12px;
        }

        #resultMessage {
            margin-top: 10px;
            font-size: 18px;
        }

        .success {
            font-size: 20px;
            margin-top: 15px;
        }

        /* FOOTER */

        footer {
            margin-top: 35px;
            color: #64806a;
            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            h1 {
                font-size: 34px;
            }

            .categories {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <!-- SPROUT -->

    <div class="sprout">🌱</div>

    <h1>SORT IT OUT! 🌎</h1>

    <div class="subtitle">
        Where does your trash go?
    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search an item..."
            onkeydown="if(event.key === 'Enter') searchItem()"
        >

        <button onclick="searchItem()">
            Search
        </button>

    </div>


    <!-- CATEGORIES -->

    <div class="categories">

        <button class="category" onclick="showCategory('food', this)">
            🍎<br>Food
        </button>

        <button class="category" onclick="showCategory('drinks', this)">
            🥤<br>Drinks
        </button>

        <button class="category" onclick="showCategory('packaging', this)">
            📦<br>Packaging
        </button>

        <button class="category" onclick="showCategory('lunch', this)">
            🍕<br>Lunch
        </button>

        <button class="category" onclick="showCategory('utensils', this)">
            🍴<br>Utensils
        </button>

        <button class="category" onclick="showCategory('not-sure', this)">
            ❓<br>Not Sure
        </button>

    </div>


    <!-- QUICK ITEMS -->

    <div id="quickItems">

        <h3 id="categoryTitle">
            🌱 Pick an item!
        </h3>

        <div class="item-buttons" id="itemButtons"></div>

    </div>


    <!-- SPROUT MESSAGE -->

    <div class="message-card" id="sproutMessage">

        🌱 "Hey! What are we sorting today?"

    </div>


    <!-- POINTS -->

    <div class="points-card">

        ⭐ Your Points:
        <span id="points">0 points</span>

    </div>


    <!-- GOAL -->

    <div class="goal-card">

        🌎 School Sorting Goal

        <div class="progress-background">

            <div id="progress"></div>

        </div>

        <p id="goalText">
            0 / 1,000 items sorted
        </p>

    </div>


    <!-- RESULT -->

    <div id="result">

        <div id="resultItem"></div>

        <div id="resultBin"></div>

        <div id="resultMessage"></div>

        <div class="success" id="successMessage"></div>

    </div>


    <footer>

        🌱 Every item counts!

    </footer>

</div>


<script>

    /* =========================
       POINTS + PROGRESS
    ========================= */

    let points = 0;
    let itemsSorted = 0;


    /* =========================
       ITEM DATABASE
       ========================= */

    const items = {

        /* FOOD */

        banana: {

            color: "#247a3b",

        },

        },

        food: {

            emoji: "🍎",

            color: "#247a3b",

            category: "food"
        },

            category: "food"
        },

        eggshell: {

            message: "Put it in the GREEN bin! 🌱",

        },

        meat: {

            bin: "🟢 ORGANICS",
            color: "#247a3b",
            message: "Put it in the GREEN bin! 🌱",
            category: "food"
        },

        vegetables: {
            name: "Vegetables",
            emoji: "🥦",
            bin: "🟢 ORGANICS",
            color: "#247a3b",
            message: "Put it in the GREEN bin! 🌱",
            category: "food"
        },


        /* DRINKS */

        waterbottle: {

        },

        },

        soda: {

        },


        /* PACKAGING */

        cardboard: {

        },

        carton: {

        },


        /* LUNCH */

        pizzabox: {

        /* UTENSILS */

        fork: {
            name: "Plastic Fork",
            emoji: "🍴",
            bin: "⚪ LANDFILL",
            color: "#666666",

            category: "utensils"
        },

        spoon: {
            name: "Plastic Spoon",
            emoji: "🥄",
            bin: "⚪ LANDFILL",
            color: "#666666",
            message: "Put it in the GRAY bin! 🗑️",
            category: "utensils"
        },

        knife: {
            name: "Plastic Knife",
            emoji: "🔪",
            bin: "⚪ LANDFILL",
            color: "#666666",
            message: "Put it in the GRAY bin! 🗑️",
            category: "utensils"
        }

    };


    /* =========================
       CATEGORY ITEMS
       ========================= */

    const categoryItems = {

        food: [
            ["🍌", "Banana Peel", "banana"],
            ["🍎", "Apple", "apple"],
            ["🍎", "Apple Core", "applecore"],
            ["🍚", "Rice", "rice"],
            ["🍝", "Pasta", "pasta"],
            ["🥚", "Eggshell", "eggshell"],
            ["🥩", "Meat", "meat"],
            ["🥦", "Vegetables", "vegetables"]
        ],

        drinks: [
            ["🧴", "Water Bottle", "waterbottle"],
            ["🧴", "Plastic Bottle", "bottle"],
            ["🥫", "Drink Can", "can"],
            ["🥤", "Soda Can", "soda"]
        ],

        packaging: [
            ["📦", "Cardboard", "cardboard"],
            ["📦", "Cardboard Box", "box"],
            ["📄", "Paper", "paper"],
            ["📦", "Carton", "carton"]
        ],

        lunch: [
            ["🍕", "Pizza Box", "pizzabox"],
            ["🧻", "Napkin", "napkin"],
            ["🧻", "Paper Towel", "papertowel"]
        ],

        utensils: [
            ["🍴", "Plastic Fork", "fork"],
            ["🥄", "Plastic Spoon", "spoon"],
            ["🔪", "Plastic Knife", "knife"]
        ],

        "not-sure": []

    };


    /* =========================
       CATEGORY BUTTONS
       ========================= */

    function showCategory(category, button) {

        const quickItems = document.getElementById("quickItems");
        const itemButtons = document.getElementById("itemButtons");
        const categoryTitle = document.getElementById("categoryTitle");

        /* Remove active style from all buttons */

        document.querySelectorAll(".category").forEach(function(btn) {
            btn.classList.remove("active");
        });

        /* Add active style */

        button.classList.add("active");

        /* NOT SURE */

        if (category === "not-sure") {

            quickItems.style.display = "block";

            categoryTitle.innerHTML =
                "🌱 Not sure? Search for an item above!";

            itemButtons.innerHTML =
                "<p>Type something like <b>cardboard</b>, <b>banana</b>, or <b>can</b> into the search box.</p>";

            document.getElementById("sproutMessage").innerHTML =
                '🌱 "Hmm... let’s figure this out together!"';

            return;
        }


        /* SHOW CATEGORY */

        quickItems.style.display = "block";

        categoryTitle.innerHTML =
            "🌱 Pick an item!";

        itemButtons.innerHTML = "";


        categoryItems[category].forEach(function(item) {

            const emoji = item[0];
            const name = item[1];
            const key = item[2];

            const button = document.createElement("button");

            button.className = "item-button";

            button.innerHTML =
                emoji + " " + name;

            button.onclick = function() {
                showResult(key);
            };

            itemButtons.appendChild(button);

        });


        document.getElementById("sproutMessage").innerHTML =
            "🌱 Pick an item and I'll help you sort it!";

    }


    /* =========================
       SEARCH
       ========================= */

    function searchItem() {

        const input = document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

        if (input === "") {

            document.getElementById("result").style.display = "none";

            return;
        }


        let foundItem = null;


        /* Exact match */

        if (items[input]) {

            foundItem = input;

        } else {

            /* Look for the word inside an item name */

            for (const key in items) {

                const itemName =
                    items[key].name.toLowerCase();

                if (
                    itemName.includes(input) ||
                    input.includes(key)
                ) {

                    foundItem = key;
                    break;

                }

            }

        }


        if (foundItem) {

            showResult(foundItem);

        } else {

            showUnknown(input);

        }

    }


    /* =========================
       SHOW RESULT
       ========================= */

    function showResult(key) {

        const item = items[key];

        if (!item) {
            return;
        }


        const result =
            document.getElementById("result");

        document.getElementById("resultItem").innerHTML =
            item.emoji + " " + item.name;

        document.getElementById("resultBin").innerHTML =
            item.bin;

        document.getElementById("resultBin").style.color =
            item.color;

        document.getElementById("resultMessage").innerHTML =
            item.message;

        document.getElementById("successMessage").innerHTML =
            "⭐ +10 points! Great sorting!";


        result.style.display = "block";


        /* Add points */

        points += 10;

        itemsSorted += 1;


        document.getElementById("points").innerHTML =
            points + " points";


        updateProgress();


        document.getElementById("sproutMessage").innerHTML =
            '🌱 "YAY! You got it! Every item counts!"';


        /* Scroll to result on mobile */

        result.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }


    /* =========================
       UNKNOWN ITEM
       ========================= */

    function showUnknown(input) {

        const result =
            document.getElementById("result");


        document.getElementById("resultItem").innerHTML =
            "🤔 " + input.toUpperCase();


        document.getElementById("resultBin").innerHTML =
            "❓ NOT SURE YET";


        document.getElementById("resultBin").style.color =
            "#777777";


        document.getElementById("resultMessage").innerHTML =
            "🌱 I don't know this item yet.";


        document.getElementById("successMessage").innerHTML =
            "Try another name or ask a teacher!";


        result.style.display = "block";


        document.getElementById("sproutMessage").innerHTML =
            '🌱 "Hmm... let’s figure this out!"';


        result.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }


    /* =========================
       PROGRESS
       ========================= */

    function updateProgress() {

        const percentage =
            Math.min((itemsSorted / 1000) * 100, 100);


        document.getElementById("progress").style.width =
            percentage + "%";


        document.getElementById("goalText").innerHTML =
            itemsSorted + " / 1,000 items sorted";

    }

</script>

</html>
