<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SORT IT OUT! 🌎</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #23412b;
    text-align: center;

    /* PRETTY BACKGROUND */
    background:
        radial-gradient(circle at 10% 15%, rgba(180, 220, 185, 0.55) 0 45px, transparent 46px),
        radial-gradient(circle at 90% 20%, rgba(255, 232, 165, 0.45) 0 55px, transparent 56px),
        radial-gradient(circle at 20% 85%, rgba(190, 225, 205, 0.45) 0 70px, transparent 71px),
        radial-gradient(circle at 85% 80%, rgba(210, 235, 200, 0.5) 0 60px, transparent 61px),
        linear-gradient(135deg, #eff9f1, #f9f7e9);

    min-height: 100vh;
    overflow-x: hidden;
}


/* DECORATIVE BACKGROUND */

body::before {
    content: "🌿";
    position: fixed;
    top: 25px;
    left: 20px;
    font-size: 45px;
    opacity: 0.35;
    transform: rotate(-15deg);
    pointer-events: none;
}

body::after {
    content: "🍃";
    position: fixed;
    right: 20px;
    bottom: 25px;
    font-size: 50px;
    opacity: 0.3;
    transform: rotate(20deg);
    pointer-events: none;
}


.container {
    width: 92%;
    max-width: 700px;
    margin: auto;
    padding: 35px 0 55px;
}


/* SPROUT */

.sprout {
    font-size: 78px;
    animation: bounce 2s infinite;
    margin-bottom: 5px;
    filter: drop-shadow(0 5px 5px rgba(50,100,50,0.12));
}

@keyframes bounce {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}


/* TITLE */

h1 {
    margin: 0;
    font-size: 43px;
    color: #247a3b;
    letter-spacing: 1px;
}

.subtitle {
    font-size: 20px;
    margin-top: 8px;
    color: #52705a;
}


/* SEARCH */

.search-box {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.search-box input {
    flex: 1;
    padding: 17px;
    border: 2px solid #c4ddc8;
    border-radius: 20px;
    font-size: 17px;
    outline: none;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 5px 15px rgba(60,100,70,0.08);
}

.search-box input:focus {
    border-color: #247a3b;
    box-shadow: 0 5px 18px rgba(36,122,59,0.15);
}

.search-box button {
    padding: 16px 22px;
    border: none;
    border-radius: 20px;
    background: #247a3b;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(36,122,59,0.2);
    transition: 0.2s;
}

.search-box button:hover {
    transform: translateY(-2px);
}


/* CATEGORIES */

.categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 11px;
    margin-top: 22px;
}

.category {
    border: 2px solid transparent;
    background: rgba(255,255,255,0.92);
    border-radius: 20px;
    padding: 16px 8px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(50,90,60,0.09);
    transition: 0.2s;
}

.category:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 18px rgba(50,90,60,0.14);
}

.category.active {
    background: #247a3b;
    color: white;
    border-color: #247a3b;
}


/* QUICK ITEMS */

#quickItems {
    display: none;
    background: rgba(255,255,255,0.96);
    border-radius: 25px;
    padding: 22px;
    margin-top: 18px;
    box-shadow: 0 7px 20px rgba(50,90,60,0.1);
    border: 1px solid #e0eee2;
}

#quickItems h3 {
    margin-top: 0;
    color: #247a3b;
}

.item-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.item-button {
    border: none;
    background: #edf7ef;
    color: #23412b;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

.item-button:hover {
    background: #d9eedc;
    transform: scale(1.04);
}


/* SPROUT MESSAGE */

.message-card {
    background: rgba(255,255,255,0.96);
    border-radius: 24px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 7px 20px rgba(50,90,60,0.09);
    font-size: 17px;
    border: 1px solid #e0eee2;
}


/* POINTS */

.points-card {
    background: #fff8d9;
    border-radius: 22px;
    padding: 18px;
    margin-top: 15px;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(120,100,30,0.08);
}


/* GOAL */

.goal-card {
    background: rgba(255,255,255,0.96);
    border-radius: 24px;
    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 7px 20px rgba(50,90,60,0.09);
    border: 1px solid #e0eee2;
}

.progress-background {
    width: 100%;
    height: 18px;
    background: #e5e5e5;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}

#progress {
    height: 100%;
    width: 0%;
    background: #247a3b;
    border-radius: 20px;
    transition: width 0.5s;
}


/* RESULT */

#result {
    display: none;
    background: rgba(255,255,255,0.98);
    border-radius: 27px;
    padding: 28px;
    margin-top: 20px;
    box-shadow: 0 9px 25px rgba(50,90,60,0.13);
    border: 2px solid #dcebdd;
}

#resultItem {
    font-size: 25px;
    font-weight: bold;
}

#resultBin {
    font-size: 31px;
    font-weight: bold;
    margin-top: 12px;
}

#resultMessage {
    margin-top: 10px;
    font-size: 18px;
}

.success {
    font-size: 20px;
    margin-top: 15px;
}


/* FOOTER */

footer {
    margin-top: 38px;
    color: #64806a;
    font-size: 14px;
}


/* MOBILE */

@media (max-width: 500px) {

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 18px;
    }

    .categories {
        grid-template-columns: repeat(2, 1fr);
    }

    .search-box {
        flex-direction: column;
    }

    .search-box button {
        width: 100%;
    }

}

</style>
</head>


<body>

<div class="container">


    <!-- SPROUT -->

    <div class="sprout">
        🌱
    </div>


    <h1>
        SORT IT OUT! 🌎
    </h1>


    <div class="subtitle">
        Where does your trash go?
    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search an item..."
            onkeydown="if(event.key === 'Enter') searchItem()"
        >

        <button onclick="searchItem()">
            Search
        </button>

    </div>


    <!-- CATEGORIES -->

    <div class="categories">

        <button class="category" onclick="showCategory('food', this)">
            🍎<br>Food
        </button>

        <button class="category" onclick="showCategory('drinks', this)">
            🥤<br>Drinks
        </button>

        <button class="category" onclick="showCategory('packaging', this)">
            📦<br>Packaging
        </button>

        <button class="category" onclick="showCategory('lunch', this)">
            🍕<br>Lunch
        </button>

        <button class="category" onclick="showCategory('utensils', this)">
            🍴<br>Utensils
        </button>

        <button class="category" onclick="showCategory('not-sure', this)">
            ❓<br>Not Sure
        </button>

    </div>


    <!-- QUICK ITEMS -->

    <div id="quickItems">

        <h3 id="categoryTitle">
            🌱 Pick an item!
        </h3>

        <div class="item-buttons" id="itemButtons"></div>

    </div>


    <!-- SPROUT MESSAGE -->

    <div class="message-card" id="sproutMessage">

        🌱 "Hey! What are we sorting today?"

    </div>


    <!-- POINTS -->

    <div class="points-card">

        ⭐ Your Points:
        <span id="points">0 points</span>

    </div>


    <!-- GOAL -->

    <div class="goal-card">

        🌎 School Sorting Goal

        <div class="progress-background">

            <div id="progress"></div>

        </div>

        <p id="goalText">
            0 / 1,000 items sorted
        </p>

    </div>


    <!-- RESULT -->

    <div id="result">

        <div id="resultItem"></div>

        <div id="resultBin"></div>

        <div id="resultMessage"></div>

        <div class="success" id="successMessage"></div>

    </div>


    <footer>
        🌱 Every item counts!
    </footer>

</div>


<script>


/* =========================
   POINTS
========================= */

let points = 0;
let itemsSorted = 0;


/* =========================
   ITEM DATABASE
========================= */

const items = {

    banana: {
        name: "Banana Peel",
        emoji: "🍌",
        bin: "🟢 ORGANICS",
        color: "#247a3b",

    },

    apple: {
        name: "Apple",
        emoji: "🍎",
        bin: "🟢 ORGANICS",
        color: "#247a3b",
        message: "Put it in the GREEN bin! 🌱",

    },

    applecore: {
        name: "Apple Core",
        emoji: "🍎",
        bin: "🟢 ORGANICS",
        color: "#247a3b",
        message: "Put it in the GREEN bin! 🌱",
        category: "food"
    },

    rice: {
        name: "Rice",
        emoji: "🍚",
        bin: "🟢 ORGANICS",
        color: "#247a3b",
        message: "Put it in the GREEN bin! 🌱",
        category: "food"
    },

    pasta: {
        name: "Pasta",
        emoji: "🍝",
        bin: "🟢 ORGANICS",
        color: "#247a3b",
        message: "Put it in the GREEN bin! 🌱",
        category: "food"
    },

    eggshell: {
        name: "Eggshell",
        emoji: "🥚",
        bin: "🟢 ORGANICS",
        color: "#247a3b",
        message: "Put it in the GREEN bin! 🌱",
        category: "food"
    },

    meat: {
        name: "Meat",
        emoji: "🥩",
        bin: "🟢 ORGANICS",
        color: "#247a3b",
        message: "Put it in the GREEN bin! 🌱",
        category: "food"
    },

    vegetables: {
        name: "Vegetables",
        emoji: "🥦",
        bin: "🟢 ORGANICS",
        color: "#247a3b",
        message: "Put it in the GREEN bin! 🌱",
        category: "food"
    },


    /* DRINKS */

    waterbottle: {
        name: "Water Bottle",
        emoji: "🧴",
        bin: "🔵 RECYCLING",
        color: "#2673c9",
        message: "Put it in the BLUE bin! ♻️",
        category: "drinks"
    },

    bottle: {
        name: "Plastic Bottle",
        emoji: "🧴",
        bin: "🔵 RECYCLING",

        message: "Put it in the BLUE bin! ♻️",
        category: "drinks"
    },

    can: {
        name: "Drink Can",
        emoji: "🥫",
        bin: "🔵 RECYCLING",
        color: "#2673c9",
        message: "Put it in the BLUE bin! ♻️",
        category: "drinks"
    },

    soda: {
        name: "Soda Can",

        color: "#2673c9",
        message: "Put it in the BLUE bin! ♻️",
        category: "drinks"
    },


    /* PACKAGING */

    cardboard: {
        name: "Cardboard",
        emoji: "📦",
        bin: "🔵 RECYCLING",
        color: "#2673c9",

    },

    box: {

    },

    paper: {

    },

    carton: {
        name: "Carton",

        color: "#2673c9",
        message: "Put it in the BLUE bin! ♻️",
        category: "packaging"
    },


    /* LUNCH */

    pizzabox: {
        name: "Pizza Box",

        bin: "🟢 ORGANICS",
        color: "#247a3b",
        message: "Food-soiled pizza boxes go in the GREEN bin! 🌱",
        category: "lunch"
    },

    napkin: {
        name: "Napkin",

        category: "lunch"
    },

    papertowel: {

        category: "lunch"
    },


    /* UTENSILS */

    fork: {
        name: "Plastic Fork",
        emoji: "🍴",
        bin: "⚪ LANDFILL",

        category: "utensils"
    },

    spoon: {
        name: "Plastic Spoon",
        emoji: "🥄",
        bin: "⚪ LANDFILL",
        color: "#666666",
        message: "Put it in the GRAY bin! 🗑️",
        category: "utensils"
    },

    knife: {
        name: "Plastic Knife",
        emoji: "🔪",
        bin: "⚪ LANDFILL",
        color: "#666666",
        message: "Put it in the GRAY bin! 🗑️",
        category: "utensils"
    }

};


/* =========================
   CATEGORY LISTS
========================= */

const categoryItems = {

    food: [
        ["🍌", "Banana Peel", "banana"],
        ["🍎", "Apple", "apple"],
        ["🍎", "Apple Core", "applecore"],
        ["🍚", "Rice", "rice"],
        ["🍝", "Pasta", "pasta"],
        ["🥚", "Eggshell", "eggshell"],
        ["🥩", "Meat", "meat"],
        ["🥦", "Vegetables", "vegetables"]
    ],

    drinks: [
        ["🧴", "Water Bottle", "waterbottle"],
        ["🧴", "Plastic Bottle", "bottle"],
        ["🥫", "Drink Can", "can"],
        ["🥤", "Soda Can", "soda"]
    ],

    packaging: [
        ["📦", "Cardboard", "cardboard"],
        ["📦", "Cardboard Box", "box"],
        ["📄", "Paper", "paper"],
        ["📦", "Carton", "carton"]
    ],

    lunch: [
        ["🍕", "Pizza Box", "pizzabox"],
        ["🧻", "Napkin", "napkin"],
        ["🧻", "Paper Towel", "papertowel"]
    ],

    utensils: [
        ["🍴", "Plastic Fork", "fork"],
        ["🥄", "Plastic Spoon", "spoon"],
        ["🔪", "Plastic Knife", "knife"]
    ],

    "not-sure": []

};


/* =========================
   CATEGORY BUTTONS
========================= */

function showCategory(category, button) {

    const quickItems =
        document.getElementById("quickItems");

    const itemButtons =
        document.getElementById("itemButtons");

    const categoryTitle =
        document.getElementById("categoryTitle");


    document.querySelectorAll(".category").forEach(function(btn) {

        btn.classList.remove("active");

    });


    button.classList.add("active");


    if (category === "not-sure") {

        quickItems.style.display = "block";

        categoryTitle.innerHTML =
            "🌱 Not sure? Search for an item above!";

        itemButtons.innerHTML =
            "<p>Try searching for something like <b>cardboard</b>, <b>banana</b>, or <b>can</b>.</p>";

        document.getElementById("sproutMessage").innerHTML =
            '🌱 "Hmm... let’s figure this out together!"';

        return;
    }


    quickItems.style.display = "block";

    categoryTitle.innerHTML =
        "🌱 Pick an item!";

    itemButtons.innerHTML = "";


    categoryItems[category].forEach(function(item) {

        const emoji = item[0];
        const name = item[1];
        const key = item[2];


        const newButton =
            document.createElement("button");

        newButton.className =
            "item-button";

        newButton.innerHTML =
            emoji + " " + name;


        newButton.onclick = function() {

            showResult(key);

        };


        itemButtons.appendChild(newButton);

    });


    document.getElementById("sproutMessage").innerHTML =
        "🌱 Pick an item and I'll help you sort it!";

}


/* =========================
   SEARCH
========================= */

function searchItem() {

    const input =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if (input === "") {

        document.getElementById("result").style.display =
            "none";

        return;

    }


    let foundItem = null;


    if (items[input]) {

        foundItem = input;

    } else {

        for (const key in items) {

            const itemName =
                items[key].name.toLowerCase();


            if (
                itemName.includes(input) ||
                input.includes(key)
            ) {

                foundItem = key;

                break;

            }

        }

    }


    if (foundItem) {

        showResult(foundItem);

    } else {

        showUnknown(input);

    }

}


/* =========================
   SHOW RESULT
========================= */

function showResult(key) {

    const item = items[key];


    if (!item) {
        return;
    }


    const result =
        document.getElementById("result");


    document.getElementById("resultItem").innerHTML =
        item.emoji + " " + item.name;


    document.getElementById("resultBin").innerHTML =
        item.bin;


    document.getElementById("resultBin").style.color =
        item.color;


    document.getElementById("resultMessage").innerHTML =
        item.message;


    document.getElementById("successMessage").innerHTML =
        "⭐ +10 points! Great sorting!";


    result.style.display = "block";


    points += 10;

    itemsSorted += 1;


    document.getElementById("points").innerHTML =
        points + " points";


    updateProgress();


    document.getElementById("sproutMessage").innerHTML =
        '🌱 "YAY! You got it! Every item counts!"';


    result.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* =========================
   UNKNOWN ITEM
========================= */

function showUnknown(input) {

    const result =
        document.getElementById("result");


    document.getElementById("resultItem").innerHTML =
        "🤔 " + input.toUpperCase();


    document.getElementById("resultBin").innerHTML =
        "❓ NOT SURE YET";


    document.getElementById("resultBin").style.color =
        "#777777";


    document.getElementById("resultMessage").innerHTML =
        "🌱 I don't know this item yet.";


    document.getElementById("successMessage").innerHTML =
        "Try another name or ask a teacher!";


    result.style.display = "block";


    document.getElementById("sproutMessage").innerHTML =
        '🌱 "Hmm... let’s figure this out!"';


    result.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

    const percentage =
        Math.min((itemsSorted / 1000) * 100, 100);


    document.getElementById("progress").style.width =
        percentage + "%";


    document.getElementById("goalText").innerHTML =
        itemsSorted + " / 1,000 items sorted";

}

</script>

</html>
